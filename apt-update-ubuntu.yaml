---
# update-ubuntu.yml — full package update + conditional reboot for Ubuntu 26.04
#
# Usage:
#   ansible-playbook -i inventory.ini update-ubuntu.yml
#   ansible-playbook -i inventory.ini update-ubuntu.yml -e force_reboot=true
#   ansible-playbook -i inventory.ini update-ubuntu.yml -e reboot_enabled=false

- name: Update all packages on Ubuntu 26.04
  hosts: ubuntu
  become: true
  # Rolling update: change to a number/percentage to avoid taking everything
  # down at once (e.g. serial: "25%").
  serial: 1
  # Don't abort the whole play if one host is unreachable mid-reboot.
  max_fail_percentage: 0

  vars:
    reboot_enabled: true          # set false to patch only, never reboot
    force_reboot: false           # reboot even if /var/run/reboot-required is absent
    autoremove_enabled: true
    reboot_timeout: 900           # seconds to wait for host to come back
    apt_lock_timeout: 300         # seconds to wait for dpkg/apt locks

  pre_tasks:
    - name: Verify the target is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: >-
          This playbook targets Ubuntu, but {{ inventory_hostname }} reports
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
        quiet: true

    - name: Warn if the release is not 26.04
      ansible.builtin.debug:
        msg: >-
          Note: {{ inventory_hostname }} is running Ubuntu
          {{ ansible_facts['distribution_version'] }}, not 26.04.
      when: ansible_facts['distribution_version'] is version('26.04', '!=')

  tasks:
    - name: Wait for any running unattended-upgrades / apt process to finish
      ansible.builtin.shell: |
        set -e
        for i in $(seq 1 {{ apt_lock_timeout }}); do
          if ! fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock \
                     /var/cache/apt/archives/lock >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "apt/dpkg still locked after {{ apt_lock_timeout }}s" >&2
        exit 1
      changed_when: false
      args:
        executable: /bin/bash

    - name: Repair any interrupted dpkg state
      ansible.builtin.command: dpkg --configure -a
      register: dpkg_repair
      changed_when: dpkg_repair.stdout | length > 0
      failed_when: dpkg_repair.rc != 0

    - name: Update the apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      register: apt_cache
      retries: 3
      delay: 10
      until: apt_cache is succeeded

    - name: Upgrade all packages (dist-upgrade)
      ansible.builtin.apt:
        upgrade: dist
        autoremove: false          # handled explicitly below
        lock_timeout: "{{ apt_lock_timeout }}"
      environment:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a        # let needrestart restart services non-interactively
      register: apt_upgrade

    - name: Show what was upgraded
      ansible.builtin.debug:
        var: apt_upgrade.stdout_lines
      when: apt_upgrade.changed and apt_upgrade.stdout_lines is defined

    - name: Remove packages no longer required
      ansible.builtin.apt:
        autoremove: true
        purge: true
      when: autoremove_enabled | bool

    - name: Clean the local package cache
      ansible.builtin.apt:
        autoclean: true

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: List packages that requested the reboot
      ansible.builtin.slurp:
        src: /var/run/reboot-required.pkgs
      register: reboot_pkgs
      when: reboot_required_file.stat.exists
      failed_when: false

    - name: Report reboot trigger
      ansible.builtin.debug:
        msg: >-
          Reboot required by:
          {{ (reboot_pkgs.content | b64decode).split('\n') | select() | list | join(', ') }}
      when:
        - reboot_required_file.stat.exists
        - reboot_pkgs.content is defined

    - name: Reboot and wait for the host to return
      ansible.builtin.reboot:
        msg: "Reboot triggered by Ansible after package updates"
        reboot_timeout: "{{ reboot_timeout }}"
        connect_timeout: 15
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: systemctl is-system-running --wait
      when:
        - reboot_enabled | bool
        - reboot_required_file.stat.exists or (force_reboot | bool)

    - name: Report that a reboot is pending but was skipped
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} needs a reboot, but reboot_enabled is false."
      when:
        - reboot_required_file.stat.exists
        - not (reboot_enabled | bool)

  post_tasks:
    - name: Re-gather facts after reboot
      ansible.builtin.setup:

    - name: Confirm system state
      ansible.builtin.command: systemctl is-system-running
      register: system_state
      changed_when: false
      failed_when: system_state.stdout not in ['running', 'degraded']

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Host:      {{ inventory_hostname }}"
          - "Release:   Ubuntu {{ ansible_facts['distribution_version'] }}"
          - "Kernel:    {{ ansible_facts['kernel'] }}"
          - "Upgraded:  {{ 'yes' if apt_upgrade.changed else 'no packages changed' }}"
          - "Rebooted:  {{ 'yes' if (reboot_required_file.stat.exists and reboot_enabled | bool) or (force_reboot | bool and reboot_enabled | bool) else 'no' }}"
          - "systemd:   {{ system_state.stdout }}"
